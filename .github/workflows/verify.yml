name: Cathedral Verification

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository stratum
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn mkdocs-material

      - name: Run Verification Chambers (Pytest)
        run: |
          PYTHONPATH=. pytest -v

      - name: Build MkDocs Documentation Manifest
        run: |
          mkdocs build
